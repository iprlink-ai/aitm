<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商标分类查询系统 - 国家知识产权局参考样式</title>
    <style>
        /* ====== 设计系统：国家知识产权局官方风格 ====== */
        :root {
            /* 主色调：政务深蓝 */
            --gov-blue-dark: #0d3b7a;
            --gov-blue: #1a4d8c;
            --gov-blue-light: #2c5fa8;
            --gov-blue-pale: #e8f0fb;

            /* 强调色：政务红 */
            --gov-red: #c8161d;
            --gov-red-dark: #a51217;
            --gov-red-light: #e93c43;

            /* 金色(国徽/装饰) */
            --gov-gold: #d4a017;
            --gov-gold-light: #f0c33c;

            /* 中性色 */
            --bg-page: #f5f6f9;
            --bg-card: #ffffff;
            --bg-soft: #f8fafd;
            --border: #dde3ec;
            --border-strong: #b8c2d1;
            --ink-primary: #1a2940;
            --ink-secondary: #4a5874;
            --ink-muted: #7a8499;
            --link-blue: #1556a8;
            --link-hover: #c8161d;

            /* 阴影 */
            --shadow-sm: 0 1px 3px rgba(13, 59, 122, 0.08);
            --shadow-md: 0 2px 8px rgba(13, 59, 122, 0.1);
            --shadow-lg: 0 4px 16px rgba(13, 59, 122, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans CN", sans-serif;
            background: var(--bg-page);
            color: var(--ink-primary);
            line-height: 1.7;
            min-height: 100vh;
            padding: 0;
        }

        .container {
            max-width: 1320px;
            margin: 0 auto;
            background: var(--bg-card);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* ====== 顶部红条（国徽色） ====== */
        .top-bar {
            height: 6px;
            background: linear-gradient(90deg, var(--gov-red) 0%, var(--gov-gold) 50%, var(--gov-red) 100%);
        }

        /* ====== Header 头部（深蓝） ====== */
        .header {
            background: linear-gradient(135deg, var(--gov-blue-dark) 0%, var(--gov-blue) 100%);
            color: white;
            padding: 28px 40px;
            border-bottom: 4px solid var(--gov-red);
            position: relative;
        }

        .header-inner {
            display: flex;
            align-items: center;
            gap: 24px;
            max-width: 1240px;
            margin: 0 auto;
        }

        /* AITM 文字 Logo */
        .gov-emblem {
            width: 72px;
            height: 72px;
            background:
                radial-gradient(circle at 30% 30%, #e93c43 0%, var(--gov-red) 60%, var(--gov-red-dark) 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
            border: 3px solid var(--gov-gold);
            box-shadow:
                0 2px 8px rgba(0,0,0,0.25),
                inset 0 2px 4px rgba(255,255,255,0.25),
                inset 0 -2px 4px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .gov-emblem::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 8px;
            right: 8px;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
            border-radius: 50% 50% 60% 60% / 60% 60% 100% 100%;
            pointer-events: none;
        }

        .emblem-letters {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1;
            color: white;
            text-shadow:
                0 1px 1px rgba(0,0,0,0.4),
                0 0 6px rgba(255,255,255,0.3);
            font-family: "Arial Black", "Helvetica Neue", sans-serif;
            position: relative;
            z-index: 2;
        }

        .emblem-ring {
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid rgba(212, 160, 23, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }


        .header-text h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: white;
            margin-bottom: 4px;
        }

        .header-text h1 .sub {
            font-size: 12px;
            font-weight: normal;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.85);
            margin-left: 12px;
            padding-left: 12px;
            border-left: 1px solid rgba(255,255,255,0.3);
        }

        .header-text p {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.5px;
        }

        .header p::before { content: ""; }

        /* 头部右上角辅助链接 */
        .header-utils {
            margin-left: auto;
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: rgba(255,255,255,0.85);
        }

        .header-utils a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 2px;
            transition: all 0.2s;
        }

        .header-utils a:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.6);
            color: white;
        }

        /* ====== Stats 数据条 ====== */
        .stats-bar {
            background: var(--gov-blue-pale);
            padding: 14px 40px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--ink-secondary);
        }

        .stats-bar div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-bar div::before {
            content: "▣";
            color: var(--gov-red);
            font-size: 16px;
        }

        .stats-bar strong {
            color: var(--gov-blue-dark);
            font-size: 18px;
            font-weight: 700;
            font-family: "Consolas", monospace;
        }

        /* ====== Search 搜索区 ====== */
        .search-section {
            padding: 24px 40px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            padding: 16px 20px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .search-box label {
            font-weight: 600;
            color: var(--gov-blue-dark);
            font-size: 14px;
            white-space: nowrap;
        }

        .search-box label::before {
            content: "▶";
            color: var(--gov-red);
            margin-right: 6px;
            font-size: 10px;
        }

        .search-box select,
        .search-box input {
            padding: 9px 14px;
            border: 1px solid var(--border-strong);
            border-radius: 2px;
            font-size: 14px;
            background: white;
            color: var(--ink-primary);
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .search-box select:focus,
        .search-box input:focus {
            outline: none;
            border-color: var(--gov-blue);
            box-shadow: 0 0 0 2px rgba(26, 77, 140, 0.1);
        }

        .search-box input {
            flex: 1;
            min-width: 220px;
        }

        .search-box input::placeholder {
            color: var(--ink-muted);
            font-style: normal;
        }

        .search-box button {
            padding: 9px 22px;
            background: var(--gov-red);
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            font-family: inherit;
        }

        .search-box button:hover {
            background: var(--gov-red-dark);
        }

        .search-box button.secondary {
            background: white;
            color: var(--gov-blue-dark);
            border: 1px solid var(--gov-blue);
        }

        .search-box button.secondary:hover {
            background: var(--gov-blue-pale);
        }

        /* ====== Category Nav 快速导航 ====== */
        .category-nav {
            padding: 24px 40px;
            background: var(--bg-card);
            border-bottom: 2px solid var(--gov-blue);
        }

        .category-nav h3 {
            color: var(--gov-blue-dark);
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 700;
            padding-left: 12px;
            border-left: 4px solid var(--gov-red);
            line-height: 1.2;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 8px;
        }

        .category-btn {
            padding: 10px 6px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 2px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: var(--ink-secondary);
            font-weight: 500;
        }

        .category-btn:hover {
            background: var(--gov-blue);
            color: white;
            border-color: var(--gov-blue);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .category-btn.active {
            background: var(--gov-red);
            color: white;
            border-color: var(--gov-red);
        }

        /* ====== Content 主体 ====== */
        .content {
            padding: 32px 40px;
            min-height: 400px;
            background: var(--bg-card);
        }

        .category-section {
            margin-bottom: 24px;
            background: white;
            border: 1px solid var(--border);
            border-top: 3px solid var(--gov-blue);
            border-radius: 2px;
            padding: 0;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s;
        }

        .category-section:hover {
            box-shadow: var(--shadow-md);
        }

        .category-header {
            padding: 16px 24px;
            background: linear-gradient(180deg, var(--gov-blue-pale) 0%, white 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gov-blue-dark);
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .category-number {
            background: var(--gov-red);
            color: white;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .category-name {
            color: var(--gov-blue-dark);
        }

        .category-stats {
            font-size: 12px;
            color: var(--ink-muted);
            background: white;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 2px;
            font-family: "Consolas", monospace;
        }

        .category-description {
            padding: 14px 24px;
            background: var(--bg-soft);
            color: var(--ink-secondary);
            line-height: 1.7;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .category-description::before {
            content: "类别说明：";
            color: var(--gov-red);
            font-weight: 700;
            margin-right: 4px;
        }

        .category-body {
            padding: 20px 24px;
        }

        /* 子类别组 */
        .subcategory-group {
            margin-bottom: 18px;
        }

        .subcategory-group:last-child {
            margin-bottom: 0;
        }

        .subcategory-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gov-blue);
            margin-bottom: 10px;
            padding: 6px 12px;
            background: var(--gov-blue-pale);
            border-left: 3px solid var(--gov-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subcategory-code {
            color: var(--gov-red);
            font-family: "Consolas", monospace;
            font-weight: 700;
            margin-right: 8px;
        }

        .subcategory-name {
            flex: 1;
            color: var(--ink-primary);
        }

        .subcategory-count {
            font-size: 12px;
            color: var(--ink-muted);
            font-family: "Consolas", monospace;
            background: white;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 6px;
        }

        .item-tag {
            background: white;
            padding: 6px 12px;
            border-radius: 2px;
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--ink-secondary);
            transition: all 0.15s;
            cursor: pointer;
        }

        .item-tag:hover {
            background: var(--gov-blue-pale);
            border-color: var(--gov-blue);
            color: var(--link-blue);
        }

        .item-tag.highlight {
            background: #fff8e1;
            border-color: var(--gov-gold);
            color: var(--gov-red-dark);
            font-weight: 600;
        }

        /* ====== Results Info ====== */
        .results-info {
            background: linear-gradient(90deg, #e8f5e9 0%, #f1f8e9 100%);
            padding: 12px 20px;
            border-radius: 2px;
            margin-bottom: 20px;
            color: #2e7d32;
            display: none;
            font-size: 14px;
            border-left: 4px solid #43a047;
        }

        .results-info::before {
            content: "✓ 检索成功：";
            color: #2e7d32;
            font-weight: 700;
        }

        .no-results {
            text-align: center;
            padding: 80px 40px;
            color: var(--ink-muted);
            font-size: 14px;
            display: none;
        }

        .no-results .icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--border-strong);
        }

        /* ====== Footer ====== */
        .footer {
            background: var(--gov-blue-dark);
            color: rgba(255,255,255,0.85);
            padding: 28px 40px;
            text-align: center;
            font-size: 13px;
            border-top: 4px solid var(--gov-red);
        }

        .footer p {
            margin-bottom: 6px;
            line-height: 1.8;
        }

        .footer a {
            color: rgba(255,255,255,0.95);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255,255,255,0.5);
        }

        .footer a:hover {
            color: white;
            border-bottom-color: white;
        }

        .footer-meta {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        /* ====== Loading ====== */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--ink-muted);
        }

        .loading-spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--gov-blue-pale);
            border-top: 3px solid var(--gov-blue);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ====== 响应式 ====== */
        @media (max-width: 768px) {
            .header { padding: 20px; }
            .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-text h1 { font-size: 20px; }
            .header-text h1 .sub { display: block; margin-left: 0; padding-left: 0; border-left: none; margin-top: 4px; }
            .header-utils { margin-left: 0; }
            .stats-bar { padding: 12px 20px; font-size: 13px; }
            .stats-bar strong { font-size: 16px; }
            .search-section, .category-nav, .content, .footer { padding: 16px 20px; }
            .category-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
            .search-box { flex-direction: column; align-items: stretch; }
            .items-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar"></div>
        <div class="header">
            <div class="header-inner">
                <div class="gov-emblem">
            <div class="emblem-ring"></div>
            <div class="emblem-letters">AITM</div>
        </div>
                <div class="header-text">
                    <h1>商标分类查询系统<span class="sub">Trademark Classification Query System</span></h1>
                    <p>基于《类似商品和服务区分表》&mdash; 尼斯分类第十三版（2026版）</p>
                </div>

            </div>
        </div>

        <div class="stats-bar">
            <div>类别总数 <strong id="totalCats">45</strong> 大类</div>
            <div>类似群组 <strong id="totalSubs">498</strong> 个</div>
            <div>商品项目 <strong id="totalItems">31,678</strong> 项</div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <label>商品/服务项目检索：</label>
                <select id="categorySelect">
                    <option value="all">全部类别</option>
                </select>
                <input type="text" id="searchInput" placeholder="请输入商品或服务名称关键字，如：洗发水、肥皂、化妆品...">
                <button onclick="search()">检 索</button>
                <button class="secondary" onclick="resetAll()">重 置</button>
            </div>
        </div>

        <div class="category-nav">
            <h3>快速导航 &mdash; 选择类别查看详细信息</h3>
            <div class="category-grid" id="categoryGrid"></div>
        </div>

        <div class="content">
            <div class="results-info" id="resultsInfo"></div>
            <div class="no-results" id="noResults">
                <div class="icon">∅</div>
                <div>未检索到匹配结果，请调整检索词后重试</div>
            </div>
            <div id="categoryContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">数据加载中，请稍候...</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>基于尼斯分类第十三版（2026版）</p>
            <p>本工具仅供学习参考使用，注册商标请以国家知识产权局官方公告为准</p>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let currentKeyword = '';
        let currentHighlight = '';

        // 初始化页面
        function initPage() {
            const categoryGrid = document.getElementById('categoryGrid');
            const categorySelect = document.getElementById('categorySelect');

            // 更新统计信息
            let totalSubs = 0, totalItems = 0;
            Object.values(trademarkData).forEach(cat => {
                totalSubs += cat.subcategories.length;
                cat.subcategories.forEach(sub => {
                    totalItems += sub.items.length;
                });
            });
            document.getElementById('totalSubs').textContent = totalSubs.toLocaleString();
            document.getElementById('totalItems').textContent = totalItems.toLocaleString();

            // 生成大类导航
            const sortedIds = Object.keys(trademarkData).sort((a, b) => parseInt(a) - parseInt(b));
            sortedIds.forEach(cid => {
                const cat = trademarkData[cid];

                // 导航按钮
                const btn = document.createElement('div');
                btn.className = 'category-btn';
                btn.textContent = '第' + cid + '类';
                btn.title = cat.name;
                btn.onclick = () => filterByCategory(cid);
                categoryGrid.appendChild(btn);

                // 下拉菜单
                const option = document.createElement('option');
                option.value = cid;
                option.textContent = '第' + cid + '类 - ' + cat.name;
                categorySelect.appendChild(option);
            });

            // 显示所有类别
            displayCategories(sortedIds.map(id => trademarkData[id]));

            // 搜索框回车事件
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') search();
            });

            // 类别选择变化
            categorySelect.addEventListener('change', (e) => {
                currentFilter = e.target.value;
                if (e.target.value === 'all') {
                    if (currentKeyword) {
                        search();
                    } else {
                        displayCategories(sortedIds.map(id => trademarkData[id]));
                    }
                } else {
                    filterByCategory(e.target.value);
                }
            });
        }

        // 显示分类内容
        function displayCategories(data, keyword = '') {
            const content = document.getElementById('categoryContent');
            content.innerHTML = '';

            if (!data || data.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }

            document.getElementById('noResults').style.display = 'none';

            data.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';

                const totalItems = cat.subcategories.reduce((sum, sub) => sum + sub.items.length, 0);
                const totalSubs = cat.subcategories.length;

                let html = '<div class="category-title">';
                html += '<span class="category-number">第' + cat.id + '类</span>';
                html += cat.name;
                html += '<span class="category-stats">' + totalSubs + ' 个类似群组 · ' + totalItems + ' 项商品</span>';
                html += '</div>';

                if (cat.description) {
                    html += '<div class="category-description">' + cat.description + '</div>';
                }

                // 子类别
                cat.subcategories.forEach(sub => {
                    if (sub.items.length === 0 && !keyword) return;
                    if (keyword && sub.items.length === 0) return;

                    html += '<div class="subcategory-group">';
                    html += '<div class="subcategory-title">';
                    html += '<span class="subcategory-code">' + sub.code + '</span>';
                    html += '<span class="subcategory-name">' + sub.name + '</span>';
                    html += '<span class="subcategory-count">' + sub.items.length + ' 项</span>';
                    html += '</div>';

                    if (sub.items.length > 0) {
                        html += '<div class="items-grid">';
                        sub.items.forEach(item => {
                            let itemClass = 'item-tag';
                            if (keyword && item.indexOf(keyword) >= 0) {
                                itemClass += ' highlight';
                            }
                            const displayText = highlightKeyword(item, keyword);
                            html += '<div class="' + itemClass + '" title="' + item + '">' + displayText + '</div>';
                        });
                        html += '</div>';
                    }
                    html += '</div>';
                });

                section.innerHTML = html;
                content.appendChild(section);
            });
        }

        // 高亮关键词
        function highlightKeyword(text, keyword) {
            if (!keyword) return escapeHtml(text);
            const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp('(' + escapedKeyword + ')', 'gi');
            return escapeHtml(text).replace(regex, '<mark style="background:#ffc107;color:#000;padding:0 2px;border-radius:2px;">$1</mark>');
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 按类别筛选
        function filterByCategory(categoryId) {
            currentFilter = categoryId;
            const cat = trademarkData[categoryId];
            if (cat) {
                displayCategories([cat]);
            }
            document.getElementById('resultsInfo').style.display = 'none';

            // 更新导航按钮状态
            document.querySelectorAll('.category-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', btn.textContent === '第' + categoryId + '类');
            });
        }

        // 搜索功能
        function search() {
            const keyword = document.getElementById('searchInput').value.trim();
            currentKeyword = keyword;
            const categoryId = document.getElementById('categorySelect').value;
            currentFilter = categoryId;

            if (!keyword) {
                resetAll();
                return;
            }

            const lowerKeyword = keyword.toLowerCase();
            let results = [];
            let totalMatchedItems = 0;

            Object.values(trademarkData).forEach(cat => {
                // 类别筛选
                if (categoryId !== 'all' && cat.id !== parseInt(categoryId)) {
                    return;
                }

                let catMatch = cat.name.indexOf(keyword) >= 0 ||
                              (cat.description && cat.description.indexOf(keyword) >= 0);

                let matchedSubs = [];
                cat.subcategories.forEach(sub => {
                    let subMatch = sub.name.indexOf(keyword) >= 0;
                    let matchedItems = sub.items.filter(item => item.toLowerCase().includes(lowerKeyword));

                    if (subMatch || matchedItems.length > 0) {
                        matchedSubs.push({
                            ...sub,
                            items: matchedItems.length > 0 ? matchedItems : sub.items
                        });
                        totalMatchedItems += matchedItems.length > 0 ? matchedItems.length : sub.items.length;
                    }
                });

                if (catMatch || matchedSubs.length > 0) {
                    results.push({
                        ...cat,
                        subcategories: matchedSubs.length > 0 ? matchedSubs : cat.subcategories
                    });
                }
            });

            displayCategories(results, keyword);

            const info = document.getElementById('resultsInfo');
            if (results.length > 0) {
                info.innerHTML = '✅ 找到 <strong>' + results.length + '</strong> 个相关类别，共 <strong>' +
                                  totalMatchedItems + '</strong> 项匹配商品';
                info.style.display = 'block';
            } else {
                info.style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
            }

            clearActiveNav();
        }

        // 重置
        function resetAll() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = 'all';
            currentKeyword = '';
            currentFilter = 'all';
            const sortedIds = Object.keys(trademarkData).sort((a, b) => parseInt(a) - parseInt(b));
            displayCategories(sortedIds.map(id => trademarkData[id]));
            document.getElementById('resultsInfo').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
            clearActiveNav();
        }

        // 清除导航按钮高亮
        function clearActiveNav() {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
